<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f3ef" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Baseline tags for the initial HTML. Per-route titles, descriptions and
         structured data are set by src/lib/useMeta.ts once React mounts. -->
    <title>CDB — Architecture Firm for Custom Homes in the US</title>
    <meta
      name="description"
      content="CDB is a US architecture firm designing modern custom homes, renovations and commercial spaces. Licensed in TX, CA and NY. See the work and start a project."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CDB Architecture" />
    <meta property="og:title" content="CDB — Architecture Firm for Custom Homes in the US" />
    <meta
      property="og:description"
      content="Modern custom homes, renovations and commercial spaces across the United States."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap"
    />

    <script>
      // Set before first paint so scroll-reveal elements can start hidden
      // without the prerendered HTML being invisible when JS is unavailable.
      document.documentElement.classList.add('js')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
